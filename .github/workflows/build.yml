name: Build La Pauta Mic Pro (VST3 Windows + instalador)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear instalador
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "No se encontró ISCC.exe" }

          $iss = Get-ChildItem -Path . -Filter LaPautaMicPro.iss -Recurse |
            Where-Object { $_.FullName -notmatch '\\build\\' } | Select-Object -First 1
          if (-not $iss) { throw "No se encontró LaPautaMicPro.iss en el repo" }

          Write-Host "ISCC: $iscc"
          Write-Host "Script: $($iss.FullName)"
          Get-ChildItem -Recurse build\LaPautaMicPro_artefacts\Release\VST3 | Select-Object -First 5 FullName

          New-Item -ItemType Directory -Force -Path installer-out | Out-Null
          & $iscc "/DBuildDir=$PWD\build" "/O$PWD\installer-out" $iss.FullName
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló con código $LASTEXITCODE" }

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Mic-Pro-Instalador-Windows
          path: installer-out/La-Pauta-Mic-Pro-Setup.exe

      - name: Subir VST3 (sin instalador)
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Mic-Pro-VST3-Windows
          path: build/LaPautaMicPro_artefacts/Release/VST3/
