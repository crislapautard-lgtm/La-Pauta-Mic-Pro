name: Build La Pauta Mic Pro (VST3 Windows + instalador)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Crear instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\LaPautaMicPro.iss"

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Mic-Pro-Instalador-Windows
          path: installer/Output/La-Pauta-Mic-Pro-Setup.exe

      - name: Subir VST3 (sin instalador)
        uses: actions/upload-artifact@v4
        with:
          name: La-Pauta-Mic-Pro-VST3-Windows
          path: build/LaPautaMicPro_artefacts/Release/VST3/
